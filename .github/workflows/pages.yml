name: GitHub Pages (Testversion)

# Testversion unter https://ma3u.github.io/politik-duell/ – das Duell mit Beispieldaten (ohne Supabase), das
# Programm-Quiz mit den geprüften Fragen und der Firebase-Vermittlung (firebase/README.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASIS_PFAD: /politik-duell/
          VITE_DATENQUELLE: mock
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
